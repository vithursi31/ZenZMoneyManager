version: "3.8"

services:
  postgres:
    image: bitnami/postgresql:14.4.0
    container_name: postgres-zenzhabit
    ports:
      - "5434:5432"
    environment:
      POSTGRESQL_USERNAME: zenzhabit
      POSTGRESQL_PASSWORD: zenzhabit
      POSTGRESQL_DATABASE: zenzhabit
    volumes:
      - postgres-data:/bitnami/postgresql

  redis:
    image: bitnami/redis:7.2.4
    container_name: redis-zenzhabit
    ports:
      - "6379:6379"
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - redis-data:/bitnami/redis/data

volumes:
  postgres-data:
  redis-data:
