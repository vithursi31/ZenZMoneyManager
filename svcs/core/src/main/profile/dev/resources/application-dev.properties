spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

spring.thymeleaf.cache=true

# The com.zenzmoney level is owned by logback-spring.xml (DEBUG, so debug.log stays a
# superset of info.log/error.log). Setting logging.level.com.zenzmoney here would override
# that logger and silently narrow debug.log — leave it to the logback config.
logging.level.org.springframework=WARN

# Never on outside loc: this branch writes a live OTP into a retained log file.
zenzmoney.app.log-code-on-send-failure=false
