spring.datasource.url=jdbc:postgresql://localhost:5454/zenzmoney
spring.datasource.username=zenzmoney
spring.datasource.password=zenzmoney
spring.datasource.hikari.maximum-pool-size=10

spring.data.redis.host=localhost
spring.data.redis.port=6363

spring.thymeleaf.cache=false

# The com.zenzmoney level is owned by logback-spring.xml (DEBUG, so debug.log stays a
# superset of info.log/error.log). Setting logging.level.com.zenzmoney here would override
# that logger and silently narrow debug.log — leave it to the logback config.
logging.level.org.springframework.security=DEBUG

# Local only: when SMTP is unavailable, write the OTP to the log so a flow can be completed
# without a mail server. Never enable this where the log files are retained (see SmtpEmailSender).
zenzmoney.app.log-code-on-send-failure=true

# Writes the full prompt, the user's message and the model's raw reply into llm.log, so a
# prompt regression can be read rather than guessed at. LOC ONLY — the payload carries the
# user's own words and every category name they own, and llm.log is kept 30 days.
zenzmoney.llm.log-payloads=true
