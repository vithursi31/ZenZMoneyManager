chat.unreadable = දැන් මට එය තේරුම් ගත නොහැකි විය. නැවත උත්සාහ කරන්න — උදාහරණයක් ලෙස "දිවා ආහාරයට 5ක් වියදම් කළා".
chat.update-unsupported = දැනට කතාබහෙන් පවතින ගනුදෙනුවක් වෙනස් කිරීමට මට නොහැකිය. ඔබට එය ගනුදෙනු ලැයිස්තුවෙන් සංස්කරණය කළ හැකිය.
chat.nothing-to-record = ඔබට වාර්තා කිරීමට අවශ්‍ය කුමක්දැයි මට තේරුම් ගත නොහැකි විය. "දිවා ආහාරයට 5ක් වියදම් කළා" වැනි දෙයක් උත්සාහ කරන්න.
chat.currency-unset = ඔබ භාවිතා කරන මුදල් ඒකකය මම තවම දන්නේ නැත. ඔබේ පැතිකඩ සැකසීම සම්පූර්ණ කරන්න, එවිට මට මෙය වාර්තා කළ හැකිය.
chat.low-confidence = මම එය නිවැරදිව තේරුම් ගත්තාදැයි විශ්වාස නැත. ඔබට එය වෙනත් ආකාරයකින් කිව හැකිද?
chat.rest-unread = මට වරකට එකක් පමණක් ගත හැකිය — ඉතිරි ඒවා එකින් එක කියන්න.
chat.no-spending-yet = මට තවම වාර්තා වූ වියදම් නොමැත. ගනුදෙනු කිහිපයක් එක් කරන්න, එවිට ඔබේ මුදල් යන්නේ කොහේදැයි මට කිව හැකිය.
chat.answer-failed = දැන් මට එය ගණනය කිරීමට නොහැකි විය. මොහොතකින් නැවත උත්සාහ කරන්න.
chat.undone = ඉවත් කරන ලදී.

# ── Chat: removing, and the way back from it (soft delete, §1.6)
chat.undone-recurring = එම නැවත නැවත ගෙවීම නවත්වන ලදී. නැවත අවශ්‍ය නම් එය ඔබේ දායකත්ව ලැයිස්තුවේ තිබේ.
chat.recurring-delete-unsupported = කතාබහෙන් නැවත නැවත ගෙවීමක් ඉවත් කිරීමට මට නොහැකිය. ඔබට එය දායකත්ව ලැයිස්තුවෙන් මකා දැමිය හැකිය.
chat.delete.confirm = ඔබට ඉවත් කිරීමට අවශ්‍ය මෙයද?
chat.delete.not-found = ගැළපෙන ඇතුළත් කිරීමක් හමු නොවීය. ඔබට එය ගනුදෙනු ලැයිස්තුවෙන් මකා දැමිය හැකිය.
chat.delete.many = ගැළපෙන ඇතුළත් කිරීම් එකකට වඩා තිබේ. නිවැරදි එක තෝරා ගැනීමට ගනුදෙනු ලැයිස්තුවෙන් මකා දමන්න.
chat.delete.done = ඔබේ වාර්තාවෙන් ඉවත් කරන ලදී.
chat.delete.already-gone = එම ඇතුළත් කිරීම දැනටමත් ඉවත් කර ඇත.
chat.restored = එය නැවත ස්ථානගත කරන ලදී.
chat.duplicate-suspected = මෙය ඔබ දැනටමත් වාර්තා කර ඇති දෙයක් හා සමානයි. කෙසේ වෙතත් එකතු කරන්නද?
