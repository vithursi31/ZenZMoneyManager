email.verification.subject = ඔබේ ZenZ Money Manager සත්‍යාපන කේතය
email.verification.body = ZenZ Money Manager වෙත සාදරයෙන් පිළිගනිමු!\n\nඔබේ විද්‍යුත් තැපැල් සත්‍යාපන කේතය:\n\n    {0}\n\nඔබේ ගිණුම සැකසීම අවසන් කිරීමට යෙදුමේ එය ඇතුළත් කරන්න (මිනිත්තු 10ක් වලංගුයි).\n\nඔබ මෙම ගිණුම නොසෑදුවේ නම්, මෙම පණිවිඩය නොසලකා හැරිය හැක.\n
email.password-reset.subject = ඔබේ ZenZ Money Manager මුරපද යළි පිහිටුවීමේ කේතය
email.password-reset.body = ඔබේ ZenZ Money Manager මුරපදය යළි පිහිටුවීමට ඉල්ලීමක් ලැබුණි.\n\nඔබේ මුරපද යළි පිහිටුවීමේ කේතය:\n\n    {0}\n\nඔබේ නව මුරපදය සමඟ යෙදුමේ එය ඇතුළත් කරන්න (මිනිත්තු 10ක් වලංගුයි).\n\nඔබ මෙය ඉල්ලා නොසිටියේ නම්, මෙම පණිවිඩය නොසලකා හැරිය හැක — ඔබේ මුරපදය වෙනස් නොවේ.\n
