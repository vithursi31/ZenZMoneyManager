email.verification.subject = Ihr ZenZ Money Manager Bestätigungscode
email.verification.body = Willkommen bei ZenZ Money Manager!\n\nIhr Bestätigungscode lautet:\n\n    {0}\n\nGeben Sie ihn in der App ein, um die Einrichtung Ihres Kontos abzuschließen (10 Minuten gültig).\n\nWenn Sie dieses Konto nicht erstellt haben, können Sie diese Nachricht ignorieren.\n
email.password-reset.subject = Ihr ZenZ Money Manager Code zum Zurücksetzen des Passworts
email.password-reset.body = Wir haben eine Anfrage zum Zurücksetzen Ihres ZenZ Money Manager Passworts erhalten.\n\nIhr Code lautet:\n\n    {0}\n\nGeben Sie ihn zusammen mit Ihrem neuen Passwort in der App ein (10 Minuten gültig).\n\nWenn Sie dies nicht angefordert haben, können Sie diese Nachricht ignorieren — Ihr Passwort wird nicht geändert.\n

# ── chat undo
error.chat.nothing-to-undo = Diese Nachricht hat nichts hinzugefügt, es gibt also nichts rückgängig zu machen.
error.chat.already-undone = Das wurde bereits rückgängig gemacht.

# ── Chat replies. Not errors: what the assistant says back, stored as the key in
#    chat_message.content and rendered at the boundary like everything else. None of
#    them carries a money amount — the client formats the figures from the draft.
chat.ask.amount = Klar, das kann ich hinzufügen. Wie hoch war der Betrag?
chat.ask.amount-expense = Klar, ich kann diese Ausgabe hinzufügen. Wie viel hast du ausgegeben?
chat.ask.amount-income = Klar, das kann ich hinzufügen. Wie viel hast du erhalten?
chat.ask.type = Ist das Geld ausgegangen oder eingegangen?
chat.ask.category-expense = Wofür hast du es ausgegeben?
chat.ask.category-income = Woher kam dieses Geld?
chat.ask.cadence = Wie oft wiederholt sich das?
chat.added = Zu deinem Verzeichnis hinzugefügt.
chat.added-recurring = Gespeichert — ich wiederhole das für dich.
chat.draft-ready = Hier ist der Entwurf — sieh ihn dir an, dann füge ich ihn deinem Verzeichnis hinzu.
chat.unreadable = Das konnte ich gerade nicht lesen. Versuchst du es noch einmal — zum Beispiel „5 fürs Mittagessen ausgegeben“?
chat.update-unsupported = Ich kann eine bestehende Transaktion noch nicht über den Chat ändern. Du kannst sie in deiner Transaktionsliste bearbeiten.
chat.nothing-to-record = Ich konnte nicht erkennen, was du erfassen wolltest. Versuche es mit etwas wie „5 fürs Mittagessen ausgegeben“.
chat.currency-unset = Ich weiß noch nicht, welche Währung du verwendest. Schließe die Einrichtung deines Profils ab, dann kann ich das erfassen.
chat.low-confidence = Ich bin nicht sicher, ob ich das richtig verstanden habe. Kannst du es anders formulieren?
chat.rest-unread = Ich kann davon nur eines auf einmal übernehmen — erzähl mir die anderen einzeln.
chat.no-spending-yet = Ich habe noch keine Ausgaben erfasst. Füge ein paar Transaktionen hinzu, dann kann ich dir sagen, wohin dein Geld fließt.
chat.answer-failed = Das konnte ich gerade nicht ausrechnen. Bitte versuche es gleich noch einmal.
chat.undone = Entfernt.

# ── Chat: removing, and the way back from it (soft delete, §1.6)
chat.undone-recurring = Ich habe die wiederkehrende Zahlung gestoppt. Sie steht weiterhin in deinen Abos, falls du sie zurückwillst.
chat.recurring-delete-unsupported = Eine wiederkehrende Zahlung kann ich nicht über den Chat entfernen. Du kannst sie in deinen Abos löschen.
chat.delete.confirm = Ist das der Eintrag, den du entfernen möchtest?
chat.delete.not-found = Ich habe keinen passenden Eintrag gefunden. Du kannst ihn in deiner Transaktionsliste löschen.
chat.delete.many = Mehr als ein Eintrag passt dazu. Bitte lösche ihn in deiner Transaktionsliste, damit du den richtigen wählst.
chat.delete.done = Aus deinem Verzeichnis entfernt.
chat.delete.already-gone = Dieser Eintrag war schon entfernt.
chat.restored = Wieder eingefügt.
chat.duplicate-suspected = Das sieht nach etwas aus, das du schon erfasst hast. Trotzdem hinzufügen?
