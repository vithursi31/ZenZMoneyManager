email.password-reset.body = Recebemos um pedido para repor a sua palavra-passe do ZenZ Money Manager.\n\nO seu código de reposição é:\n\n    {0}\n\nIntroduza-o na aplicação juntamente com a nova palavra-passe (válido durante 10 minutos).\n\nSe não fez este pedido, pode ignorar esta mensagem: a sua palavra-passe não será alterada.\n
