email.verification.subject = Votre code de vérification ZenZ Money Manager
email.verification.body = Bienvenue sur ZenZ Money Manager !\n\nVotre code de vérification est :\n\n    {0}\n\nSaisissez-le dans l''application pour terminer la configuration de votre compte (valable 10 minutes).\n\nSi vous n''avez pas créé ce compte, vous pouvez ignorer ce message.\n
email.password-reset.subject = Votre code de réinitialisation de mot de passe ZenZ Money Manager
email.password-reset.body = Nous avons reçu une demande de réinitialisation de votre mot de passe ZenZ Money Manager.\n\nVotre code de réinitialisation est :\n\n    {0}\n\nSaisissez-le dans l''application avec votre nouveau mot de passe (valable 10 minutes).\n\nSi vous n''êtes pas à l''origine de cette demande, vous pouvez ignorer ce message — votre mot de passe ne changera pas.\n

# ── chat undo
error.chat.nothing-to-undo = Ce message n'a rien ajouté, il n'y a donc rien à annuler.
error.chat.already-undone = Cela a déjà été annulé.

# ── Chat replies. Not errors: what the assistant says back, stored as the key in
#    chat_message.content and rendered at the boundary like everything else. None of
#    them carries a money amount — the client formats the figures from the draft.
chat.ask.amount = Bien sûr, je peux ajouter cela. De quel montant s'agissait-il ?
chat.ask.amount-expense = Bien sûr, je peux ajouter cette dépense. Combien avez-vous dépensé ?
chat.ask.amount-income = Bien sûr, je peux ajouter cela. Combien avez-vous reçu ?
chat.ask.type = Cet argent est-il sorti ou entré ?
chat.ask.category-expense = Dans quoi l'avez-vous dépensé ?
chat.ask.category-income = D'où vient cet argent ?
chat.ask.cadence = À quelle fréquence cela se répète-t-il ?
chat.added = Ajouté à votre registre.
chat.added-recurring = Enregistré — je le répéterai pour vous.
chat.draft-ready = Voici le brouillon — vérifiez-le et je l'ajouterai à votre registre.
chat.unreadable = Je n'ai pas réussi à lire cela. Pouvez-vous réessayer — par exemple « dépensé 5 pour le déjeuner » ?
chat.update-unsupported = Je ne peux pas encore modifier une transaction existante depuis la discussion. Vous pouvez la modifier dans votre liste de transactions.
chat.nothing-to-record = Je n'ai pas compris ce que vous vouliez enregistrer. Essayez par exemple « dépensé 5 pour le déjeuner ».
chat.currency-unset = Je ne connais pas encore votre devise. Terminez la configuration de votre profil et je pourrai enregistrer ceci.
chat.low-confidence = Je ne suis pas sûr d'avoir bien compris. Pourriez-vous le formuler autrement ?
chat.rest-unread = Je ne peux en prendre qu'un à la fois — parlez-moi des autres un par un.
chat.no-spending-yet = Je n'ai encore aucune dépense enregistrée. Ajoutez quelques transactions et je pourrai vous dire où va votre argent.
chat.answer-failed = Je n'ai pas pu calculer cela pour le moment. Veuillez réessayer dans un instant.
chat.undone = Supprimé.

