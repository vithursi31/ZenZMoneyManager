chat.delete.confirm = Est-ce bien celle que vous voulez supprimer ?
chat.delete.not-found = Je n'ai pas trouvé d'entrée correspondante à supprimer. Vous pouvez la supprimer dans votre liste de transactions.
chat.delete.many = Plusieurs entrées correspondent. Veuillez la supprimer dans votre liste de transactions pour choisir la bonne.
chat.delete.done = Supprimé de votre registre.
chat.delete.already-gone = Cette entrée avait déjà été supprimée.
chat.restored = Je l'ai remise.
chat.duplicate-suspected = Cela ressemble à quelque chose que vous avez déjà enregistré. L'ajouter quand même ?
