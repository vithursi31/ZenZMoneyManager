email.password-reset.body = Hemos recibido una solicitud para restablecer su contraseña de ZenZ Money Manager.\n\nSu código de restablecimiento es:\n\n    {0}\n\nIntrodúzcalo en la aplicación junto con su nueva contraseña (válido durante 10 minutos).\n\nSi no ha solicitado esto, puede ignorar este mensaje: su contraseña no cambiará.\n

# ── chat undo
error.chat.nothing-to-undo = Ese mensaje no añadió nada, así que no hay nada que deshacer.
error.chat.already-undone = Eso ya se deshizo.

# ── Chat replies. Not errors: what the assistant says back, stored as the key in
#    chat_message.content and rendered at the boundary like everything else. None of
#    them carries a money amount — the client formats the figures from the draft.
chat.ask.amount = Claro, puedo añadir eso. ¿De cuánto fue?
chat.ask.amount-expense = Claro, puedo añadir ese gasto. ¿Cuánto gastaste?
