# ── Bean-validation reasons (E1015). The field name stays in English: it is a contract
#    identifier the client branches on, and the client owns the label for its own form field.
NotBlank = must not be blank
NotNull = is required
Positive = must be greater than 0
Size = length must be between {2} and {1}

# ── Transactional email
email.verification.subject = Your ZenZ Money Manager verification code
email.verification.body = Welcome to ZenZ Money Manager!\n\nYour email verification code is:\n\n    {0}\n\nEnter it in the app to finish setting up your account (valid for 10 minutes).\n\nIf you did not create this account, you can ignore this message.\n
email.password-reset.subject = Your ZenZ Money Manager password reset code
email.password-reset.body = We received a request to reset your ZenZ Money Manager password.\n\nYour password reset code is:\n\n    {0}\n\nEnter it in the app along with your new password (valid for 10 minutes).\n\nIf you did not request this, you can safely ignore this message — your password will not change.\n
