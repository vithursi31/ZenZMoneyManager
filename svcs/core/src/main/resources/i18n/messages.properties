# Base bundle — English. Every other messages_<tag>.properties is a translation of this file,
# and MessageBundleCompletenessTest fails if one carries a key this file does not.
#
# WATCH THE APOSTROPHES. Any entry with a {0} placeholder is a MessageFormat pattern, where a
# single quote escapes the next character: 'a category named '{0}'' renders the placeholder
# literally. Double every apostrophe in a pattern -- ''{0}'', don''t. Entries with no placeholder
# are not MessageFormat patterns and take a single apostrophe.

# ── One generic sentence per status code. The fallback whenever a rejection has no key of its
#    own, so every code in StatusCodes/ServiceCodes must appear here.
error.code.E1000 = An unexpected error occurred.
error.code.E1005 = That option is unavailable right now.
error.code.E1010 = Not found
error.code.E1013 = Bad request
error.code.E1014 = Access denied
error.code.E1015 = Validation failed
error.code.E1051 = Too many verification code requests.
error.code.E1052 = Too many chat messages.
error.code.E1053 = Too many failed login attempts.
error.code.E1060 = Authentication required
error.code.E1061 = Invalid token
error.code.E1062 = Session expired, please sign in again.
error.code.E1063 = Wrong token type
error.code.E1064 = Account not found
error.code.E1065 = Account is not active. Please verify your email.
error.code.E1066 = Account is locked
error.code.E1067 = Invalid email or password
