# Chinese (Traditional, zh-TW). A translation of messages.properties — keep the keys identical;
# MessageBundleCompletenessTest fails on a key this file has and the base does not, and any key
# missing here falls back to English.
#
# NOT a character-for-character conversion of messages_zh_CN.properties. Taiwan usage differs in
# vocabulary as well as script — 登入 not 登录, 支援 not 支持, 設定 not 设置, 預設 not 默认,
# 權杖 not 令牌, 訊息 not 消息 — so converting the Simplified file with a tool would read as
# mainland Chinese in Traditional characters.
#
# REVIEW STATUS: machine-assisted, NOT yet reviewed by a native speaker.
#
# WATCH THE APOSTROPHES: an entry with {0} is a MessageFormat pattern where a single quote escapes
# the next character — double every apostrophe in those. Quotation here uses 「」, which is safe.

