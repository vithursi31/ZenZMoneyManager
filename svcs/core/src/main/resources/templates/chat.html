<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Chat</title>
    <link rel="stylesheet" th:href="@{/css/chat.css}">
</head>
<body>
    <th:block th:replace="~{fragments/header :: header}"></th:block>

    <main class="chat">
        <h1>Add a transaction by chat</h1>

        <!-- No browser session login exists yet, so the page gets its own token. -->
        <form id="signin" class="signin" hidden>
            <p class="signin-hint">Sign in to start.</p>
            <label>Email <input type="email" id="email" autocomplete="username" required></label>
            <label>Password <input type="password" id="password" autocomplete="current-password" required></label>
            <button type="submit">Sign in</button>
            <p class="error" id="signin-error" role="alert" hidden></p>
        </form>

        <section id="conversation" hidden>
            <ol class="transcript" id="transcript" aria-live="polite"></ol>

            <!-- The figures behind an answered question, so the prose can be checked. -->
            <section class="insight" id="insight" hidden aria-labelledby="insight-title">
                <h2 id="insight-title">Where your money went</h2>
                <div id="insight-months"></div>
            </section>

            <!-- The draft the model was too unsure to write on its own. The ordinary
                 path never shows this: a complete, confident message is already recorded,
                 and the transcript card carries its Undo. -->
            <section class="preview" id="preview" hidden aria-labelledby="preview-title">
                <h2 id="preview-title">Draft</h2>
                <dl class="preview-fields">
                    <dt>Type</dt><dd id="p-type">—</dd>
                    <dt>Amount</dt><dd id="p-amount">—</dd>
                    <dt>Category</dt><dd id="p-category">—</dd>
                    <dt>Description</dt><dd id="p-note">—</dd>
                    <dt>Date</dt><dd id="p-date">—</dd>
                    <dt id="p-cadence-label" hidden>Repeats</dt><dd id="p-cadence" hidden>—</dd>
                </dl>

                <form class="edit" id="edit" hidden>
                    <label>Type
                        <select id="e-type">
                            <option value="EXPENSE">Expense</option>
                            <option value="INCOME">Income</option>
                        </select>
                    </label>
                    <label>Amount <input type="number" id="e-amount" step="0.01" min="0"></label>
                    <label>Category <select id="e-category"></select></label>
                    <label>Description <input type="text" id="e-note" maxlength="500"></label>
                    <label>Date <input type="date" id="e-date"></label>
                    <label id="e-cadence-row" hidden>Repeats
                        <select id="e-cadence">
                            <option value="">Not set</option>
                            <option value="DAILY">Daily</option>
                            <option value="WEEKLY">Weekly</option>
                            <option value="MONTHLY">Monthly</option>
                            <option value="YEARLY">Yearly</option>
                        </select>
                    </label>
                    <div class="preview-actions">
                        <button type="submit">Save changes</button>
                        <button type="button" id="edit-cancel">Discard changes</button>
                    </div>
                </form>

                <div class="preview-actions" id="preview-actions">
                    <button type="button" id="create" class="primary">Create</button>
                    <button type="button" id="edit-open">Edit</button>
                    <button type="button" id="cancel">Cancel</button>
                </div>
                <p class="error" id="preview-error" role="alert" hidden></p>
            </section>

            <form class="composer" id="composer">
                <input type="text" id="message" maxlength="500" autocomplete="off"
                       placeholder="e.g. I spent $20 — or ask how to spend less" aria-label="Message">
                <button type="submit" id="send">Send</button>
            </form>
            <p class="error" id="chat-error" role="alert" hidden></p>
        </section>
    </main>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
    <script th:attr="nonce=${cspNonce}" th:src="@{/js/chat.js}"></script>
</body>
</html>
