spring.profiles.default=loc

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.port=8080

habit.app.base-url=${APP_BASE_URL:http://localhost:8080}
habit.app.from-email=${MAIL_FROM:no-reply@zenzhabits.local}

habit.jwt.secret=${JWT_SECRET:default-secret-key-change-in-production-must-be-at-least-256-bits-long}
# 1 hour
habit.jwt.access-token-expiration=3600000
# 30 days
habit.jwt.refresh-token-expiration=2592000000
# 24 hours
habit.jwt.email-verify-expiration=86400000

habit.google.app-id=${GOOGLE_APP_ID:}
habit.google.app-secret=${GOOGLE_APP_SECRET:}
habit.google.app-redirect-url=${GOOGLE_REDIRECT_URL:}
habit.google.ios-app-id=${GOOGLE_IOS_APP_ID:}
habit.google.android-app-id=${GOOGLE_ANDROID_APP_ID:}

habit.apple.client-id=${APPLE_CLIENT_ID:}
habit.apple.client-id-web=${APPLE_CLIENT_ID_WEB:}
habit.apple.team-id=${APPLE_TEAM_ID:}
habit.apple.key-id=${APPLE_KEY_ID:}
habit.apple.private-key=${APPLE_PRIVATE_KEY:}

habit.facebook.app-id=${FACEBOOK_APP_ID:}
habit.facebook.app-secret=${FACEBOOK_APP_SECRET:}
habit.facebook.app-redirect-url=${FACEBOOK_REDIRECT_URL:}
habit.facebook.graph-version=${FACEBOOK_GRAPH_VERSION:v19.0}
