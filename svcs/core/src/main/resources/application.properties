spring.profiles.default=loc

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.port=8080

zenzmoney.app.base-url=${APP_BASE_URL:http://localhost:8080}
zenzmoney.app.from-email=${MAIL_FROM:no-reply@zenzmoney.local}

# The languages user-facing messages are served in (F-1.26). Comma-separated BCP-47 tags; each one
# needs a matching src/main/resources/i18n/messages_<tag>.properties (dashes become underscores:
# zh-TW -> messages_zh_TW.properties), and a tag without one is dropped at startup with an ERROR.
# English is always available — messages.properties IS the English bundle and every other language
# falls back to it key by key.
#
# A caller's tag is matched on language + script, so region is ignored (fr-CA -> fr, pt-BR -> pt)
# but Chinese is not: zh-TW/zh-HK/zh-Hant -> Traditional, zh-CN/zh-SG/zh-Hans/zh -> Simplified.
zenzmoney.i18n.available-languages=${AVAILABLE_LANGUAGES:en,zh-CN,zh-TW,fr,es,pt,de,it,ru,ja,ko,si}

# Snowflake entity-id coordinates — each running instance needs a unique pair (0-31 each)
zenzmoney.id.datacenter-id=${ID_DATACENTER_ID:1}
zenzmoney.id.worker-id=${ID_WORKER_ID:1}

zenzmoney.jwt.secret=${JWT_SECRET:default-secret-key-change-in-production-must-be-at-least-256-bits-long}
# 1 hour
zenzmoney.jwt.access-token-expiration=3600000
# 30 days
zenzmoney.jwt.refresh-token-expiration=2592000000

# OTP codes (email verification + password reset) — 10 minutes
zenzmoney.otp.email-verify-ttl-ms=600000
zenzmoney.otp.password-reset-ttl-ms=600000

zenzmoney.google.app-id=${GOOGLE_APP_ID:}
zenzmoney.google.app-secret=${GOOGLE_APP_SECRET:}
zenzmoney.google.app-redirect-url=${GOOGLE_REDIRECT_URL:}
zenzmoney.google.ios-app-id=${GOOGLE_IOS_APP_ID:}
zenzmoney.google.android-app-id=${GOOGLE_ANDROID_APP_ID:}

zenzmoney.apple.client-id=${APPLE_CLIENT_ID:}
zenzmoney.apple.client-id-web=${APPLE_CLIENT_ID_WEB:}

zenzmoney.facebook.app-id=${FACEBOOK_APP_ID:}
zenzmoney.facebook.app-secret=${FACEBOOK_APP_SECRET:}
zenzmoney.facebook.app-redirect-url=${FACEBOOK_REDIRECT_URL:}
zenzmoney.facebook.graph-version=${FACEBOOK_GRAPH_VERSION:v19.0}

# Sign-in blocks a request thread on a provider we do not control, so both are bounded.
zenzmoney.oauth.connect-timeout-ms=${OAUTH_CONNECT_TIMEOUT_MS:3000}
zenzmoney.oauth.timeout-ms=${OAUTH_TIMEOUT_MS:8000}

# Self-hosted extraction model for chat transaction entry (F-1.9a) — Qwen2.5 on
# Ollama. The base-url default suits an Ollama running on the host; in Docker the
# compose file points LLM_BASE_URL at the "ollama" service.
#
# Model default is the 1.5B for two reasons. Licensing: 1.5B/7B/14B are Apache
# 2.0, but qwen2.5:3b is under the qwen-research licence (non-commercial) — do
# not make it the default. Speed: measured ~3.2s per extraction on a CPU-only
# 8-core dev box. A host with spare RAM sets LLM_MODEL=qwen2.5:7b-instruct for
# better category reasoning, which is also Apache 2.0.
#
# Timeouts are short on purpose: chat entry degrades to "try again" rather than
# holding a request thread (plan §9).
# Which model serves chat. "ollama" is a model we host; "gemini" is Google's hosted API.
# Default is ollama on purpose: it needs no secret, so a fresh clone and an offline
# machine both work. Switching is one env var — but see domain §9, because under gemini
# the user's own words leave the building.
zenzmoney.llm.provider=${LLM_PROVIDER:ollama}

zenzmoney.llm.base-url=${LLM_BASE_URL:http://localhost:11434}
# Measured on the loc box (8-thread i5, no GPU) against the real extraction prompt:
#   qwen3:1.7b   ~11s warm, ~33s cold   <- chosen
#   qwen2.5:1.5b  ~5s warm               (faster, but older and weaker on instructions)
#   qwen3:4b     ~94s warm               <- unusable here; prefill dominates on CPU
# Size is the constraint, not the family: anything above ~2B stops being interactive
# without a GPU. Revisit all three numbers before changing this on different hardware.
zenzmoney.llm.model=${LLM_MODEL:qwen3:1.7b}
zenzmoney.llm.temperature=${LLM_TEMPERATURE:0.1}
# Higher than extraction on purpose: the figures are fixed by the prompt, so the
# only freedom is wording, and 0.1 makes advice read like a form letter.
zenzmoney.llm.advice-temperature=${LLM_ADVICE_TEMPERATURE:0.3}
zenzmoney.llm.connect-timeout-ms=${LLM_CONNECT_TIMEOUT_MS:2000}
# Sized from measurement, not feel: a warm extraction against this prompt takes ~5s, a
# cold one ~32s because loading the model dominates. 20s used to guarantee that the first
# message after any pause failed. keep-alive is what actually removes the cold path —
# the timeout only has to cover the one genuine load after a restart.
zenzmoney.llm.timeout-ms=${LLM_TIMEOUT_MS:45000}

# How long Ollama holds the model in RAM between calls. Its own default is 5m, which is
# shorter than a user's pause between messages. "-1" pins it forever; a duration frees the
# RAM on a box that needs it back.
zenzmoney.llm.keep-alive=${LLM_KEEP_ALIVE:30m}

# ---- Gemini (used only when zenzmoney.llm.provider=gemini) ----
# The key is never committed. Set GEMINI_API_KEY in the environment; with the provider
# set to gemini and no key, the app refuses to start rather than failing every message.
zenzmoney.gemini.api-key=${GEMINI_API_KEY:}
zenzmoney.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
zenzmoney.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
zenzmoney.gemini.advice-model=${GEMINI_ADVICE_MODEL:gemini-3.5-flash-lite}
zenzmoney.gemini.temperature=${GEMINI_TEMPERATURE:0.1}
zenzmoney.gemini.advice-temperature=${GEMINI_ADVICE_TEMPERATURE:0.3}
zenzmoney.gemini.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT_MS:2000}
# Far tighter than Ollama's 45s: that number exists to cover a cold CPU model load.
# A hosted call that has not answered in 15s is not going to.
zenzmoney.gemini.timeout-ms=${GEMINI_TIMEOUT_MS:15000}

# How often recurring templates are generated into the ledger (F-1.7). Catch-up makes the
# cadence a latency bound, not a correctness one: what it actually bounds is the gap between
# an occurrence leaving the upcoming-payments window and its transaction row existing, so a
# payment due "now" is posted within minutes rather than up to an hour. Spring 6-field cron.
zenzmoney.recurring.cron=${RECURRING_CRON:0 0/15 * * * *}
